name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: vet & test
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: build
        if: startsWith(github.ref, 'refs/tags/v')
        run: VERSION="${GITHUB_REF_NAME#v}" sh build.sh

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hubproxy-lite-linux-amd64
            dist/hubproxy-lite-linux-arm64
            dist/SHA256SUMS
            deploy/install.sh
            deploy/hubproxy-lite.openrc
            deploy/hubproxy-lite.confd
